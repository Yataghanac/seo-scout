[project]
name = "seo-scout"
version = "0.1.0"
description = "Crawl a site, audit every page against SEO rules, and propose validated title/meta rewrites with GPT-4o."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yataghanac" }]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "protego>=0.3",
  "openai>=1.40",
  "tiktoken>=0.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "tldextract>=5.1",
  "defusedxml>=0.7",
  "truststore>=0.10",
]

[project.scripts]
seo-scout = "seo_scout.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_scout"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF", "SIM", "ASYNC"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-statements = 40
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0915"]
# Typer maps every CLI flag to a parameter, so command functions legitimately take many.
"src/seo_scout/cli.py" = ["PLR0913", "PLR0917"]
# FastAPI maps every query parameter to a parameter the same way.
"src/seo_scout/api/routes.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["protego", "protego.*", "tldextract", "tldextract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::ResourceWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["seo_scout.audit", "seo_scout.ai"]
